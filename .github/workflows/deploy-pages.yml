name: Deploy to GitHub Pages

# main        -> https://sebinsunny-cmyk.github.io/iGnite-Hackathon/
# development -> https://sebinsunny-cmyk.github.io/iGnite-Hackathon/preview/
#
# Both publish to the gh-pages branch, into different folders, so neither
# overwrites the other. The concurrency group serialises runs so two pushes
# can never race on the same branch.
#
# One-time setup, in Settings -> Pages:
#   Source = "Deploy from a branch",  Branch = gh-pages,  Folder = / (root)

on:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # take the current gh-pages so the other branch's folder survives
          if git clone --depth 1 --branch gh-pages "$REMOTE" out 2>/dev/null; then
            echo "gh-pages checked out"
          else
            echo "gh-pages does not exist yet — starting it"
            mkdir out && cd out && git init -q -b gh-pages && git remote add origin "$REMOTE" && cd ..
          fi

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "publishing to site root"
            find out -mindepth 1 -maxdepth 1 ! -name .git ! -name preview -exec rm -rf {} +
            cp -r dist/. out/
          else
            echo "publishing to /preview"
            rm -rf out/preview
            mkdir -p out/preview
            cp -r dist/. out/preview/
          fi

          touch out/.nojekyll
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed — skipping"
            exit 0
          fi
          git commit -q -m "Publish ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q origin gh-pages

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "### Published to production" >> "$GITHUB_STEP_SUMMARY"
            echo "https://sebinsunny-cmyk.github.io/iGnite-Hackathon/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published to preview" >> "$GITHUB_STEP_SUMMARY"
            echo "https://sebinsunny-cmyk.github.io/iGnite-Hackathon/preview/" >> "$GITHUB_STEP_SUMMARY"
          fi
